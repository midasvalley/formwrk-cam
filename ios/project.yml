# XcodeGen spec. `./goblincam.py setup` generates GoblinCam.xcodeproj from this
# with DEVELOPMENT_TEAM and BUNDLE_ID filled in from config.json; the generated
# project is never committed.
name: GoblinCam
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

targets:
  GoblinCam:
    type: application
    platform: iOS
    sources:
      - path: GoblinCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_FILE: GoblinCam/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
